name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Check project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            flutter create --project-name mohamed_alqadi_education --platforms=android .
          fi

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text()

              replacements = {
                  "flutter.compileSdkVersion": "35",
                  "flutter.minSdkVersion": "21",
                  "flutter.targetSdkVersion": "35",
              }

              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = text.replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 35"
              )

              text = text.replace(
                  "minSdkVersion flutter.minSdkVersion",
                  "minSdkVersion 21"
              )

              text = text.replace(
                  "targetSdkVersion flutter.targetSdkVersion",
                  "targetSdkVersion 35"
              )

              path.write_text(text)

          print("Android configuration updated.")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Check APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mohamed-alqadi-education-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
