name: mohamed_alqadi_education
description: برنامج محمد القاضي التعليمي العلمي
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # التخزين المحلي
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # التاريخ والوقت
  intl: ^0.19.0

  # PDF
  pdf: ^3.11.1
  printing: ^5.13.4
  pdfx: 2.8.0

  # الملفات والمعرفات
  uuid: ^4.5.0
  file_picker: ^8.1.2

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.3
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
