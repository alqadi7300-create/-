name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Check project
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f google-services.json

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            flutter create \
              --project-name mohamed_alqadi_education \
              --platforms=android .
          fi

      - name: Copy Firebase configuration
        run: |
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          test -f android/app/google-services.json

      - name: Configure Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for filename in [
              "android/app/build.gradle",
              "android/app/build.gradle.kts",
          ]:
              path = Path(filename)

              if not path.exists():
                  continue

              text = path.read_text()

              text = text.replace(
                  "flutter.compileSdkVersion",
                  "35"
              )

              text = text.replace(
                  "flutter.minSdkVersion",
                  "21"
              )

              text = text.replace(
                  "flutter.targetSdkVersion",
                  "35"
              )

              path.write_text(text)

          print("Android SDK configuration completed.")
          PY

      - name: Configure Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          groovy = Path("android/app/build.gradle")

          if groovy.exists():
              text = groovy.read_text()

              if "com.google.gms.google-services" not in text:
                  text += "\napply plugin: 'com.google.gms.google-services'\n"

              groovy.write_text(text)

          kts = Path("android/app/build.gradle.kts")

          if kts.exists():
              text = kts.read_text()

              if 'com.google.gms.google-services' not in text:
                  marker = "plugins {"

                  if marker in text:
                      text = text.replace(
                          marker,
                          marker + '\n    id("com.google.gms.google-services")',
                          1
                      )

              kts.write_text(text)

          print("Google Services configuration completed.")
          PY

      - name: Configure Google Services dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("android/build.gradle")

          if gradle.exists():
              text = gradle.read_text()

              dependency = (
                  "classpath 'com.google.gms:google-services:4.4.2'"
              )

              if dependency not in text:
                  marker = "dependencies {"

                  if marker in text:
                      text = text.replace(
                          marker,
                          marker + "\n        " + dependency,
                          1
                      )

              gradle.write_text(text)

          print("Google Services dependency configured.")
          PY

      - name: Verify Firebase
        run: |
          test -f android/app/google-services.json

          python3 - <<'PY'
          import json

          with open(
              "android/app/google-services.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          clients = data.get("client", [])

          if not clients:
              raise SystemExit(
                  "Firebase client configuration was not found."
              )

          package_name = (
              clients[0]
              ["client_info"]
              ["android_client_info"]
              ["package_name"]
          )

          print("Firebase package:", package_name)

          if package_name != "com.example.mohamed_alqadi_education":
              raise SystemExit(
                  "Firebase package name does not match "
                  "the generated Android application."
              )
          PY

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Remove generated Flutter test
        run: |
          rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: |
          flutter analyze --no-fatal-infos

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mohamed-alqadi-education-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
