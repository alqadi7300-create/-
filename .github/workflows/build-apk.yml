name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Check project files
        run: |
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f google-services.json

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            flutter create \
              --project-name mohamed_alqadi_education \
              --platforms=android .
          fi

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure Firebase
        run: |
          set -e

          echo "Creating Firebase Android configuration..."

          mkdir -p android/app

          cp google-services.json android/app/google-services.json

          echo "Checking Firebase package name..."

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("android/app/google-services.json").read_text()
          )

          clients = data.get("client", [])

          if not clients:
              raise SystemExit("Firebase client information was not found.")

          package_name = clients[0]["client_info"]["android_client_info"]["package_name"]

          print("Firebase package:", package_name)

          expected = "com.example.mohamed_alqadi_education"

          if package_name != expected:
              raise SystemExit(
                  f"Wrong Firebase package name: {package_name}. "
                  f"Expected: {expected}"
              )
          PY

      - name: Configure Android SDK versions
        run: |
          set -e

          if [ -f android/app/build.gradle ]; then

            sed -i -E \
              's/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 35/g' \
              android/app/build.gradle

            sed -i -E \
              's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 35/g' \
              android/app/build.gradle

            sed -i -E \
              's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 21/g' \
              android/app/build.gradle

            sed -i -E \
              's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 21/g' \
              android/app/build.gradle

            sed -i -E \
              's/targetSdkVersion[[:space:]]+flutter\.targetSdkVersion/targetSdkVersion 35/g' \
              android/app/build.gradle

            sed -i -E \
              's/targetSdk[[:space:]]*=[[:space:]]*flutter\.targetSdkVersion/targetSdk = 35/g' \
              android/app/build.gradle

          fi

          if [ -f android/app/build.gradle.kts ]; then

            sed -i -E \
              's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 35/g' \
              android/app/build.gradle.kts

            sed -i -E \
              's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 21/g' \
              android/app/build.gradle.kts

            sed -i -E \
              's/targetSdk[[:space:]]*=[[:space:]]*flutter\.targetSdkVersion/targetSdk = 35/g' \
              android/app/build.gradle.kts

          fi

          echo "Android SDK configuration:"
          grep -R -nE 'compileSdk|minSdk|targetSdk' \
            android/app/build.gradle \
            android/app/build.gradle.kts 2>/dev/null || true

      - name: Add Google Services Gradle plugin
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          # Flutter 3.24.5 normally creates the Groovy Gradle files.
          root = Path("android/build.gradle")

          if root.exists():
              text = root.read_text()

              if "com.google.gms:google-services" not in text:
                  marker = "dependencies {"

                  if marker in text:
                      text = text.replace(
                          marker,
                          marker + "\n        classpath 'com.google.gms:google-services:4.5.0'",
                          1
                      )
                  else:
                      text += """

buildscript {
    dependencies {
        classpath 'com.google.gms:google-services:4.5.0'
    }
}
"""

                  root.write_text(text)

          # Also support Kotlin DSL if generated by Flutter.
          root_kts = Path("android/build.gradle.kts")

          if root_kts.exists():
              text = root_kts.read_text()

              if 'com.google.gms.google-services' not in text:
                  marker = "plugins {"

                  if marker in text:
                      text = text.replace(
                          marker,
                          marker + '\n    id("com.google.gms.google-services") version "4.5.0" apply false',
                          1
                      )

                  root_kts.write_text(text)
          PY

      - name: Apply Google Services plugin
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          groovy = Path("android/app/build.gradle")

          if groovy.exists():
              text = groovy.read_text()

              if "com.google.gms.google-services" not in text:
                  plugins_marker = "plugins {"

                  if plugins_marker in text:
                      text = text.replace(
                          plugins_marker,
                          plugins_marker + '\n    id "com.google.gms.google-services"',
                          1
                      )
                  else:
                      text += "\napply plugin: 'com.google.gms.google-services'\n"

                  groovy.write_text(text)

          kts = Path("android/app/build.gradle.kts")

          if kts.exists():
              text = kts.read_text()

              if 'com.google.gms.google-services' not in text:
                  marker = "plugins {"

                  if marker in text:
                      text = text.replace(
                          marker,
                          marker + '\n    id("com.google.gms.google-services")',
                          1
                      )

                  kts.write_text(text)
          PY

      - name: Verify Firebase Android configuration
        run: |
          set -e

          test -f android/app/google-services.json

          echo "Firebase configuration file:"
          ls -lh android/app/google-services.json

          echo "Android Gradle files:"
          ls -lh android/build.gradle android/app/build.gradle 2>/dev/null || true
          ls -lh android/build.gradle.kts android/app/build.gradle.kts 2>/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: |
          flutter analyze --no-fatal-infos

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Check APK
        run: |
          set -e

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK successfully created:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mohamed-alqadi-education-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
