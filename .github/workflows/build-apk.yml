name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create Android project
        run: flutter create --project-name mohamed_alqadi_education --platforms=android .

      - name: Use new main.dart
        run: cp lib/main_new.dart lib/main.dart

      - name: Fix Android compileSdk
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/g' android/app/build.gradle.kts
          fi

          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/g' android/app/build.gradle
          fi

      - name: Verify main.dart
        run: |
          echo "Checking main.dart..."
          if grep -n "convertHtmlToPdf" lib/main.dart; then
            echo "ERROR: convertHtmlToPdf still exists in main.dart"
            exit 1
          fi
          echo "main.dart is OK"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mohamed-alqadi-education-apk
          path: build/app/outputs/flutter-apk/app-release.apk
