name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.mohamedalqadi .
          fi
      - name: Set Android app display name
        run: sed -i 's/android:label="[^"]*"/android:label="منصة محمد القاضي العلمية"/' android/app/src/main/AndroidManifest.xml
      - name: Install dependencies
        run: flutter pub get
      - name: Set Android compile SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not locate Android sdkmanager under $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36"
          find android "$HOME/.pub-cache/hosted/pub.dev" -type f -name 'build.gradle*' -print0 | while IFS= read -r -d '' f; do
            sed -i -E \
              -e 's/compileSdkVersion[[:space:]]+[^[:space:]]+/compileSdkVersion 36/g' \
              -e 's/compileSdk[[:space:]]*=[[:space:]]*[^[:space:]]+/compileSdk = 36/g' \
              -e 's/compileSdk[[:space:]]+[^[:space:]]+/compileSdk 36/g' "$f"
          done
          grep -RInE 'compileSdk(Version)?[[:space:]]*(=|[[:space:]])' android "$HOME/.pub-cache/hosted/pub.dev"/*/android 2>/dev/null | head -60 || true
      - name: Remove generated placeholder test
        run: rm -f test/widget_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mohamed-alqadi-education-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
